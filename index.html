<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BV Tracker</title>
<style>
/* @css-shared */
/* FROZEN section — editing anything here requires the full manual watch checklist
   (see CONTRACT.md §9). Everything below @css-screens must be #scr-/#ovl- rooted. */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;font-family:system-ui,-apple-system,sans-serif;color:#E5E0D8;overflow:hidden}
button{border:none;background:none;color:inherit;font-family:inherit;cursor:pointer;outline:none}
input{font-family:inherit;outline:none}
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;background:#000}
.screen.active{display:flex}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:none;z-index:50;background:rgba(0,0,0,0.88);align-items:center;justify-content:center}
.overlay.active{display:flex}
.ctrl-btn{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.65);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* @css-screens */
#scr-start{flex-direction:row}
#scr-start .split{flex:1;display:flex;align-items:center;justify-content:center}
#scr-start .split-label{font-size:clamp(28px,10vw,42px);font-weight:900}

#scr-recv .zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:clamp(60px,32%,90px);transition:background 0.15s ease;z-index:2}
#scr-recv .zone-name{font-size:clamp(26px,10vw,40px);font-weight:900;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,0.7);pointer-events:none}
#scr-recv .zone-stat{font-size:clamp(12px,4.5vw,18px);font-weight:700;color:rgba(255,255,255,0.6);pointer-events:none;margin-top:2px}
#scr-recv .zone-hint{font-size:clamp(10px,3.5vw,14px);font-weight:600;color:rgba(255,255,255,0.35);pointer-events:none}

#scr-outcome .zone{display:flex;align-items:center;justify-content:center;z-index:2}
#scr-outcome .zone-label{font-weight:900;pointer-events:none}

#scr-score .half{flex:1;display:flex;align-items:center;justify-content:center;user-select:none}
#scr-score .big{font-size:clamp(58px,22vw,108px);font-weight:900;line-height:1;letter-spacing:-2px;pointer-events:none}

#scr-set .lbl,#scr-match .lbl{font-size:clamp(15px,5.5vw,22px);font-weight:700;color:#8A8378}
#scr-set .big-score{font-size:clamp(40px,16vw,64px);font-weight:900;margin:clamp(4px,2vw,10px) 0}
#scr-set .btn,#scr-match .btn{padding:clamp(10px,3.5vw,16px) clamp(22px,9vw,38px);border-radius:10px;font-size:clamp(14px,5vw,20px);font-weight:800;color:#0d0d0d;margin-top:clamp(8px,3vw,14px)}

#scr-stats .bar,#scr-settings .bar{display:flex;gap:4px;padding:clamp(16px,7vw,26px) clamp(34px,15%,52px) 4px;flex-shrink:0;justify-content:center}
#scr-stats .bar-btn,#scr-settings .bar-btn{padding:clamp(6px,2.2vw,10px) clamp(10px,3.5vw,16px);border-radius:8px;background:#1A1713;color:#8A8378;font-size:clamp(11px,3.8vw,15px);font-weight:700;white-space:nowrap}
#scr-stats .wrap{flex:1;overflow-y:auto;padding:0 clamp(26px,13%,44px) clamp(50px,20%,90px)}
#scr-stats .pgrow{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,18px);padding:2px 0 clamp(16px,7vw,26px);flex-shrink:0}
#scr-stats .pg-btn{width:clamp(38px,14vw,52px);height:clamp(34px,12vw,46px);border-radius:10px;background:#1A1713;color:#B3B792;font-size:clamp(18px,7vw,26px);font-weight:900;display:flex;align-items:center;justify-content:center}
#scr-stats .pg-lbl{font-size:clamp(12px,4vw,16px);font-weight:700;color:#5A5247;min-width:5ch;text-align:center}
#scr-stats .hdr{font-size:clamp(13px,4.5vw,17px);font-weight:800;color:#8A8378;text-transform:uppercase;letter-spacing:1px;margin:clamp(8px,3vw,14px) 0 clamp(4px,1.5vw,8px);text-align:center}
#scr-stats .row{display:flex;justify-content:space-between;align-items:baseline;padding:clamp(3px,1.2vw,6px) 0;font-size:clamp(14px,5vw,19px)}
#scr-stats .row .l{color:#8A8378;font-weight:600}
#scr-stats .row .v{font-weight:800}
#scr-stats .pill-row{display:flex;gap:4px;justify-content:center;margin:clamp(6px,2vw,10px) 0}
#scr-stats .pill{padding:clamp(5px,1.8vw,8px) clamp(10px,3.5vw,15px);border-radius:14px;background:#1A1713;color:#8A8378;font-size:clamp(12px,4.2vw,16px);font-weight:700}
#scr-stats .pill.on{background:rgba(155,181,110,0.25);color:#9BB56E}
#scr-stats .pcard{margin-bottom:clamp(10px,3.5vw,16px)}
#scr-stats .pname{font-size:clamp(16px,6vw,24px);font-weight:900;text-align:center}
#scr-stats .pso{font-size:clamp(30px,12vw,48px);font-weight:900;text-align:center;line-height:1.1}

#scr-settings .wrap{flex:1;overflow-y:auto;padding:0 clamp(26px,13%,44px) clamp(50px,20%,90px)}
#scr-settings .hdr{font-size:clamp(12px,4vw,15px);font-weight:800;color:#8A8378;text-transform:uppercase;letter-spacing:1px;margin:clamp(10px,3.5vw,16px) 0 clamp(4px,1.5vw,7px)}
#scr-settings .row{display:flex;justify-content:space-between;align-items:center;padding:clamp(8px,3vw,13px) clamp(8px,3vw,12px);background:#15120E;border-radius:8px;margin-bottom:4px;font-size:clamp(13px,4.6vw,17px)}
#scr-settings .row .l{font-weight:700}
#scr-settings .row .v{color:#5A5247;font-weight:700}
#scr-settings .mode-btn{flex:1;padding:clamp(8px,3vw,13px) 4px;border-radius:8px;background:#1A1713;color:#8A8378;font-size:clamp(12px,4.2vw,16px);font-weight:800}
#scr-settings .mode-btn.active{background:rgba(155,181,110,0.25);color:#9BB56E}
#scr-settings .name-input{flex:1;min-width:0;background:#15120E;border:none;border-radius:6px;padding:clamp(8px,3vw,12px);color:#E5E0D8;font-size:clamp(13px,4.6vw,17px);font-weight:700}
#scr-settings .ver{text-align:center;color:#3E372F;font-size:clamp(10px,3.4vw,13px);font-weight:700;margin-top:clamp(12px,4vw,20px)}

#ovl-confirm .box{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,4vw,18px);padding:24px}
#ovl-confirm .txt{font-size:clamp(18px,7vw,28px);font-weight:900}
#ovl-confirm .sub{font-size:clamp(12px,4.2vw,16px);color:#8A8378}
#ovl-confirm .btns{display:flex;gap:clamp(10px,4vw,18px)}
#ovl-confirm .cbtn{padding:clamp(10px,3.5vw,15px) clamp(24px,10vw,40px);border-radius:10px;font-size:clamp(14px,5vw,20px);font-weight:800;color:#E5E0D8}
</style>
</head>
<body>

<!-- START: Who serves first? -->
<div class="screen active" id="scr-start" style="position:relative">
  <div style="position:absolute;top:clamp(14px,7%,26px);left:50%;transform:translateX(-50%);z-index:14;font-size:clamp(13px,4.6vw,18px);font-weight:700;color:#8A8378;white-space:nowrap;pointer-events:none">Who serves first?</div>
  <button class="split" style="background:#1f2c1d" onclick="startServe(0)">
    <span class="split-label" style="color:#809671">Us</span>
  </button>
  <button class="split" style="background:#2c1f15" onclick="startServe(1)">
    <span class="split-label" style="color:#B58860">Them</span>
  </button>
  <button class="ctrl-btn" onclick="openSettings('scr-start')" style="position:absolute;bottom:clamp(10px,4%,18px);left:50%;transform:translateX(-50%);width:clamp(32px,12vw,42px);height:clamp(32px,12vw,42px);font-size:clamp(14px,5vw,19px);z-index:14">☰</button>
</div>

<!-- GAME SCREEN 1: who received? -->
<div class="screen" id="scr-recv" style="position:relative">
  <div style="position:absolute;top:clamp(6px,4%,14px);left:50%;transform:translateX(-50%);z-index:15;pointer-events:none">
    <span id="rs-phase" style="font-size:clamp(16px,6vw,24px);font-weight:800;color:#809671">Sideout</span>
  </div>
  <div style="position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;text-align:center">
    <div id="rs-serve" style="font-size:clamp(14px,5.5vw,22px);font-weight:700;color:#809671"></div>
    <div style="display:flex;align-items:baseline;justify-content:center;gap:2px">
      <span id="rs-us" style="font-size:clamp(34px,14vw,52px);font-weight:900;color:#809671">0</span>
      <span style="font-size:clamp(22px,8vw,32px);color:rgba(255,255,255,0.2);font-weight:400">:</span>
      <span id="rs-them" style="font-size:clamp(34px,14vw,52px);font-weight:900;color:#B58860">0</span>
    </div>
    <div style="font-size:clamp(9px,3vw,12px);font-weight:600;display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,10px);white-space:nowrap;margin-top:2px">
      <span id="rs-off-left"></span>
      <span id="rs-sets" style="color:#5A5247">S 0-0</span>
      <span id="rs-off-right"></span>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:row;gap:1px;min-height:0">
    <button class="zone" id="rs-left" onclick="pickRecv(0)">
      <span class="zone-hint">Receiver</span>
      <span class="zone-name" id="rs-left-name">P1</span>
      <span class="zone-stat" id="rs-left-stat"></span>
    </button>
    <button class="zone" id="rs-right" onclick="pickRecv(1)">
      <span class="zone-hint">Receiver</span>
      <span class="zone-name" id="rs-right-name">P2</span>
      <span class="zone-stat" id="rs-right-stat"></span>
    </button>
  </div>
  <button class="ctrl-btn" id="rs-undo" onclick="event.stopPropagation();undoLast()" style="position:absolute;left:clamp(14px,8%,24px);top:56%;width:clamp(30px,11vw,38px);height:clamp(30px,11vw,38px);font-size:clamp(13px,4.5vw,18px);opacity:0.5;z-index:14">↩</button>
  <button class="ctrl-btn" onclick="event.stopPropagation();openStats()" style="position:absolute;right:clamp(14px,8%,24px);top:56%;width:clamp(30px,11vw,38px);height:clamp(30px,11vw,38px);font-size:clamp(13px,4.5vw,18px);opacity:0.5;z-index:14">☰</button>
  <button id="rs-svc-btn" onclick="svcError()" style="flex-shrink:0;padding:clamp(26px,12vw,44px) 0;width:100%;z-index:2;background:rgba(60,40,0,0.35)">
    <span style="font-size:clamp(16px,6vw,24px);font-weight:800;color:#C8A050" id="rs-svc-text">Serve error</span>
  </button>
</div>

<!-- GAME SCREEN 2: what happened? -->
<div class="screen" id="scr-outcome">
  <div style="flex:1;display:flex;flex-direction:column;gap:1px;min-height:0">
    <button class="zone" onclick="pickOutcome('clean_so')" style="flex:2;background:rgba(50,70,35,0.55)">
      <span class="zone-label" style="font-size:clamp(18px,7vw,28px);color:#9BB56E">Clean SO</span>
    </button>
    <div style="flex:3;display:flex;flex-direction:row;gap:1px;min-height:0">
      <button class="zone" onclick="pickOutcome('zero_won')" style="flex:1;background:rgba(75,55,25,0.45)">
        <span class="zone-label" style="font-size:clamp(16px,6vw,24px);color:rgba(200,160,80,0.8)">0 Won</span>
      </button>
      <button class="zone" onclick="pickOutcome('zero_lost')" style="flex:1;background:rgba(75,55,25,0.45)">
        <span class="zone-label" style="font-size:clamp(16px,6vw,24px);color:rgba(200,160,80,0.8)">0 Lost</span>
      </button>
    </div>
    <div style="flex:3;display:flex;flex-direction:row;gap:1px;min-height:0">
      <button class="zone" onclick="pickOutcome('aced')" style="flex:1;background:rgba(61,24,21,0.85)">
        <span class="zone-label" style="font-size:clamp(14px,5.5vw,22px);color:rgba(180,100,90,0.8)">Aced</span>
      </button>
      <button class="zone" onclick="pickOutcome('blocked')" style="flex:1;background:rgba(61,24,21,0.85)">
        <span class="zone-label" style="font-size:clamp(14px,5.5vw,22px);color:rgba(180,100,90,0.8)">Blocked</span>
      </button>
      <button class="zone" onclick="pickOutcome('error')" style="flex:1;background:rgba(61,24,21,0.85)">
        <span class="zone-label" style="font-size:clamp(14px,5.5vw,22px);color:rgba(180,100,90,0.8)">Error</span>
      </button>
    </div>
  </div>
</div>

<!-- SET COMPLETE -->
<div class="screen" id="scr-set" style="align-items:center;justify-content:center">
  <div class="lbl" id="set-label"></div>
  <div class="big-score" id="set-score"></div>
  <div class="lbl" id="set-sets" style="font-size:clamp(13px,4.6vw,18px)"></div>
  <button class="btn" style="background:#809671" onclick="startNextSet()">Next set</button>
</div>

<!-- MATCH OVER -->
<div class="screen" id="scr-match" style="align-items:center;justify-content:center">
  <div class="lbl">Match over</div>
  <div id="match-winner" style="font-size:clamp(26px,10vw,42px);font-weight:900;margin:clamp(4px,2vw,8px) 0"></div>
  <div id="match-sets" style="font-size:clamp(20px,8vw,32px);font-weight:800;color:#8A8378"></div>
  <div id="match-scores" style="font-size:clamp(12px,4.2vw,16px);color:#5A5247;margin-top:2px"></div>
  <button class="btn" style="background:#2A2218;color:#B3B792" onclick="openStats()">Stats</button>
  <button class="btn" style="background:#2D2620;color:#8A8378" onclick="resetAll()">New match</button>
</div>

<!-- SCORE MODE (livestream score keeper) -->
<div class="screen" id="scr-score" style="position:relative">
  <button class="half" style="background:rgba(255,145,0,0.12)" onclick="scoreTap('them')">
    <span class="big" style="color:#FF9100" id="sc-them">0</span>
  </button>
  <button class="half" style="background:rgba(68,138,255,0.12)" onclick="scoreTap('us')">
    <span class="big" style="color:#448AFF" id="sc-us">0</span>
  </button>
  <button class="ctrl-btn" onclick="event.stopPropagation();scoreUndoOne()" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(40px,14vw,52px);height:clamp(40px,14vw,52px);font-size:clamp(18px,7vw,24px);background:rgba(20,20,20,0.94);border:2px solid rgba(255,255,255,0.2);z-index:14">↩</button>
  <button class="ctrl-btn" onclick="event.stopPropagation();openSettings('scr-score')" style="position:absolute;left:50%;bottom:clamp(6px,2.5%,12px);transform:translateX(-50%);width:clamp(28px,10vw,36px);height:clamp(28px,10vw,36px);font-size:clamp(12px,4.2vw,16px);opacity:0.6;z-index:14">☰</button>
</div>

<!-- STATS (paged, readable at 272px) -->
<div class="screen" id="scr-stats">
  <div class="bar">
    <button class="bar-btn" onclick="closeStats()">← Back</button>
    <button class="bar-btn" style="color:#B3B792" onclick="openSettings('scr-stats')">Config</button>
  </div>
  <div class="wrap" id="stp-content"></div>
  <div class="pgrow">
    <button class="pg-btn" onclick="statsNav(-1)">‹</button>
    <span class="pg-lbl" id="stp-page">1/4</span>
    <button class="pg-btn" onclick="statsNav(1)">›</button>
  </div>
</div>

<!-- SETTINGS -->
<div class="screen" id="scr-settings">
  <div class="bar">
    <button class="bar-btn" onclick="closeSettings()">← Back</button>
  </div>
  <div class="wrap">
    <div class="hdr">Game mode</div>
    <div style="display:flex;gap:4px;margin-bottom:4px">
      <button class="mode-btn" id="mode-match" onclick="setMode('match')">Match</button>
      <button class="mode-btn" id="mode-score" onclick="setMode('score')">Score</button>
    </div>
    <div class="hdr" style="color:#809671">Our team</div>
    <div style="display:flex;gap:4px;margin-bottom:4px">
      <input id="name-p1" class="name-input" style="border-left:3px solid #809671" placeholder="P1" maxlength="12" oninput="saveNames()">
      <input id="name-p2" class="name-input" style="border-left:3px solid #B3B792" placeholder="P2" maxlength="12" oninput="saveNames()">
    </div>
    <div class="hdr" style="color:#B58860">Opponents</div>
    <div style="display:flex;gap:4px;margin-bottom:4px">
      <input id="name-ta1" class="name-input" style="border-left:3px solid #B58860" placeholder="O1" maxlength="12" oninput="saveNames()">
      <input id="name-ta2" class="name-input" style="border-left:3px solid #D2AB80" placeholder="O2" maxlength="12" oninput="saveNames()">
    </div>
    <div class="hdr">Player sides</div>
    <div class="row" onclick="toggleLayout()">
      <span class="l">Tap to swap</span>
      <span class="v" id="layout-val"></span>
    </div>
    <div class="hdr">Google Sheets</div>
    <div class="row" onclick="toggleLivePush()">
      <span class="l">Live push</span>
      <span class="v" id="live-val">ON</span>
    </div>
    <div class="row" onclick="sendTestPing()">
      <span class="l" style="color:#9BB56E">Send test ping</span>
      <span class="v" id="ping-status">→</span>
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
      <span class="l" style="font-size:clamp(11px,3.8vw,14px);color:#8A8378">Apps Script URL (runtime override)</span>
      <input id="sheets-url-input" class="name-input" type="url" placeholder="https://script.google.com/...">
      <button class="bar-btn" style="background:#1f2e1c;color:#9BB56E" onclick="saveSheetsUrl()">Save URL</button>
    </div>
    <div class="hdr">Export</div>
    <div class="row" onclick="downloadCSV()">
      <span class="l">CSV download</span><span class="v">→</span>
    </div>
    <div class="row" onclick="downloadVLCChapters()">
      <span class="l" style="color:#B58860">VLC chapters</span><span class="v">→</span>
    </div>
    <div style="margin-top:clamp(12px,4vw,20px)">
      <div class="row" style="background:#1f2e1c;border-left:3px solid #9BB56E" onclick="startGame()">
        <span class="l" style="color:#9BB56E;font-weight:800">Start game</span>
        <span class="v" style="color:#9BB56E">→</span>
      </div>
      <div class="row" style="border-left:3px solid #A04938" onclick="openConfirm()">
        <span class="l" style="color:#A04938">Reset match</span>
        <span class="v" style="color:#A04938">→</span>
      </div>
    </div>
    <div class="ver" id="ver-stamp"></div>
  </div>
</div>

<!-- CONFIRM RESET (modal) -->
<div class="overlay" id="ovl-confirm">
  <div class="box">
    <div class="txt">Reset?</div>
    <div class="sub">All match data will be cleared</div>
    <div class="btns">
      <button class="cbtn" style="background:#A04938" onclick="resetAll()">Yes</button>
      <button class="cbtn" style="background:#3E372F" onclick="closeConfirm()">No</button>
    </div>
  </div>
</div>

<script>
"use strict";
var APP_VERSION="watch 3.0.0 (2026-06-11)";

/* ═══════════════════════════════════
   CONFIG
   ═══════════════════════════════════ */
// Players: 0=P1, 1=P2 (our team), 2=O1, 3=O2
var PL=[
  {name:"P1",color:"#809671"},
  {name:"P2",color:"#B3B792"},
  {name:"O1",color:"#B58860"},
  {name:"O2",color:"#D2AB80"}
];
var gameMode="match";
var sheetsUrl="https://script.google.com/macros/s/AKfycbzSXy7P7jQcSq7yviCcxZS3hYbwCrrm0LrlDPpQWqjrwwF3Cn6h_c127eSX5aELIgbf/exec";
var layout="p2left";

(function initNames(){
  var params=new URLSearchParams(location.search);
  var p1=params.get("p1"),p2=params.get("p2"),o1=params.get("o1"),o2=params.get("o2");
  var mode=params.get("mode");
  if(p1)PL[0].name=p1;if(p2)PL[1].name=p2;
  if(o1)PL[2].name=o1;if(o2)PL[3].name=o2;
  if(mode&&["match","score"].indexOf(mode)>=0)gameMode=mode;
  try{
    var s=localStorage.getItem("bv_players");
    if(s){var d=JSON.parse(s);
      if(!p1&&d.p1)PL[0].name=d.p1;if(!p2&&d.p2)PL[1].name=d.p2;
      if(!o1&&d.o1)PL[2].name=d.o1;if(!o2&&d.o2)PL[3].name=d.o2;
      if(!mode&&d.mode&&["match","score"].indexOf(d.mode)>=0)gameMode=d.mode;
    }
  }catch(e){}
})();

/* @core-start v3 — edit in watch.html, copy whole block to review.html, run node test.js */
var Core=(function(){
  // Outcome vocabulary — CONTRACT.md §1. recvStat=0 ⇒ excluded from reception stats.
  var OUTCOMES={
    clean_so:  {recvStat:1,wins:1,zeros:0,losses:0,blocked:0,aced:0,errors:0,sum: 1},
    zero_won:  {recvStat:1,wins:1,zeros:1,losses:0,blocked:0,aced:0,errors:0,sum: 0},
    zero_lost: {recvStat:1,wins:0,zeros:1,losses:1,blocked:0,aced:0,errors:0,sum: 0},
    aced:      {recvStat:1,wins:0,zeros:0,losses:1,blocked:0,aced:1,errors:0,sum:-1},
    blocked:   {recvStat:1,wins:0,zeros:0,losses:1,blocked:1,aced:0,errors:0,sum:-1},
    recv_error:{recvStat:1,wins:0,zeros:0,losses:1,blocked:0,aced:0,errors:1,sum:-1},
    svc_error: {recvStat:0,wins:0,zeros:0,losses:0,blocked:0,aced:0,errors:0,sum: 0},
    score_tap: {recvStat:0,wins:0,zeros:0,losses:0,blocked:0,aced:0,errors:0,sum: 0}
  };
  // Live tab — FROZEN 65-column contract (CONTRACT.md §4)
  var LIVE_COLUMNS=[
    "timestamp","scoreUs","scoreThem","setsUs","setsThem","setNum",
    "phase","server","lastAction","soTeam",
    "p1Name","p1SO","p1Recv","p1Wins","p1Zeros","p1Lost",
    "p1Blocked","p1Aced","p1Errors","p1SvAces","p1SvcErr",
    "p2Name","p2SO","p2Recv","p2Wins","p2Zeros","p2Lost",
    "p2Blocked","p2Aced","p2Errors","p2SvAces","p2SvcErr",
    "o1Name","o1SO","o1Recv","o1Wins","o1Zeros","o1Lost",
    "o1Blocked","o1Aced","o1Errors","o1SvAces","o1SvcErr",
    "o2Name","o2SO","o2Recv","o2Wins","o2Zeros","o2Lost",
    "o2Blocked","o2Aced","o2Errors","o2SvAces","o2SvcErr",
    "bestRunUs","bestRunThem","pointPace",
    "last8","matchOver",
    "overlay_sideout","overlay_momentum","overlay_ticker",
    "overlay_players","overlay_serve","overlay_autoShow"
  ];
  // Actions tab v2 — 14-column contract (CONTRACT.md §5). videoTC computed server-side.
  var ACTIONS_COLUMNS=[
    "pointNum","timestamp","videoMs","videoTC","setNum","scoreUs","scoreThem","phase",
    "receiver","server","outcome","detail","winnerTeam","src"
  ];

  function allActions(state){
    var a=[];
    state.sets.forEach(function(s){a=a.concat(s.actions)});
    // After match over, state.actions duplicates the final archived set — skip it.
    if(state.matchOver)return a;
    return a.concat(state.actions);
  }
  function totalActionCount(state){
    var n=state.actions.length;
    state.sets.forEach(function(s){n+=s.actions.length});
    return n;
  }
  function serverGI(state){
    var side=state.recvSide===0?1:0;
    return side*2+state.servers[side];
  }
  // Scoring + rotation reducer. Rotation rule: when the receiving team wins a rally,
  // the losing (old serving) team's pointer advances and roles flip. score_tap never rotates.
  function applyAction(state,action){
    state.actions.push(action);
    if(action.winnerTeam==="us")state.sU++;else state.sT++;
    if(action.outcome!=="score_tap"){
      var recvWon=(state.recvSide===0&&action.winnerTeam==="us")||(state.recvSide===1&&action.winnerTeam==="them");
      if(recvWon){
        var oldServ=state.recvSide===0?1:0;
        state.servers[oldServ]=state.servers[oldServ]===0?1:0;
        state.recvSide=oldServ;
      }
    }
  }
  // Undo reducer. Restores score by winnerTeam AND the recvSide + servers snapshots —
  // both are required or the wrong player shows as server after undo.
  function applyUndo(state){
    if(!state.actions.length)return;
    var last=state.actions.pop();
    if(last.winnerTeam==="us"){if(state.sU>0)state.sU--}
    else{if(state.sT>0)state.sT--}
    if(last.recvSide!==undefined&&last.recvSide!==null)state.recvSide=last.recvSide;
    if(last.servers){state.servers[0]=last.servers[0];state.servers[1]=last.servers[1]}
  }
  function statsForPlayer(acts,gi){
    var s={recv:0,wins:0,zeros:0,losses:0,blocked:0,aced:0,errors:0,sum:0,kills:0,so:0};
    acts.forEach(function(a){
      var o=OUTCOMES[a.outcome];
      if(!o)return;
      if(a.winner===gi&&a.outcome==="clean_so")s.kills++;
      if(!o.recvStat)return;
      if(a.receiver!==gi)return;
      s.recv++;s.wins+=o.wins;s.zeros+=o.zeros;s.losses+=o.losses;
      s.blocked+=o.blocked;s.aced+=o.aced;s.errors+=o.errors;s.sum+=o.sum;
    });
    s.so=s.recv?(s.sum/s.recv)*100:0;
    return s;
  }
  function serveStats(acts,gi){
    var r={aces:0,errs:0,total:0};
    acts.forEach(function(a){
      if(a.outcome==="score_tap")return;
      if(a.server!==gi)return;
      r.total++;
      if(a.outcome==="aced")r.aces++;
      if(a.outcome==="svc_error")r.errs++;
    });
    return r;
  }
  function scoringRuns(acts){
    var bestUs=0,bestThem=0,curUs=0,curThem=0;
    acts.forEach(function(a){
      if(a.winnerTeam==="us"){curUs++;curThem=0;if(curUs>bestUs)bestUs=curUs}
      else{curThem++;curUs=0;if(curThem>bestThem)bestThem=curThem}
    });
    return{us:bestUs,them:bestThem};
  }
  function last8(acts){
    var r=[];
    for(var i=Math.max(0,acts.length-8);i<acts.length;i++)r.push(acts[i].winnerTeam==="us"?1:-1);
    return r;
  }
  function pointPace(acts){
    if(acts.length<2)return{avg:0};
    var sum=0;
    for(var i=1;i<acts.length;i++)sum+=acts[i].t-acts[i-1].t;
    return{avg:Math.round(sum/(acts.length-1)/1000)};
  }
  function lastActionLabel(acts,P){
    if(!acts.length)return"";
    var a=acts[acts.length-1];
    if(a.outcome==="score_tap")return"+1 "+a.winnerTeam;
    if(a.outcome==="svc_error")return"svc err "+(a.server>=0?P[a.server].name:"");
    if(a.outcome==="aced")return"ace "+(a.server>=0?P[a.server].name:"");
    var recv=a.receiver>=0?P[a.receiver].name:"";
    var win=(a.winner!==null&&a.winner!==undefined&&a.winner>=0)?P[a.winner].name:"";
    return a.outcome+" "+recv+(win?" > "+win:"");
  }
  function msToTC(ms){
    if(ms<0)ms=0;
    var h=Math.floor(ms/3600000);ms%=3600000;
    var m=Math.floor(ms/60000);ms%=60000;
    var s=Math.floor(ms/1000);var fr=ms%1000;
    return(h<10?"0":"")+h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s+"."+(fr<100?"0":"")+(fr<10?"0":"")+fr;
  }
  // lastActionFull for the Actions tab — 13 fields (ACTIONS_COLUMNS minus videoTC).
  // action must be the just-committed action object; strings ("undo"/"overlay"/"test") → null.
  function buildActionRecord(state,action){
    if(!action||typeof action!=="object")return null;
    var ref=state.videoSync||state.t0;
    return{
      pointNum:totalActionCount(state),
      timestamp:new Date(action.t).toISOString(),
      videoMs:Math.max(0,action.t-ref),
      setNum:state.setNum,
      scoreUs:state.sU,
      scoreThem:state.sT,
      phase:action.outcome==="score_tap"?"":(action.recvSide===0?"sideout":"transition"),
      receiver:action.receiver>=0?state.players[action.receiver].name:"",
      server:action.server>=0?state.players[action.server].name:"",
      outcome:action.outcome,
      detail:action.detail||"",
      winnerTeam:action.winnerTeam,
      src:action.src||"live"
    };
  }
  // Live payload — every scalar LIVE_COLUMNS key present, plus overlay {6 flags} and
  // lastActionFull. Safe for receiver:-1 / server:-1 (score mode, svc errors).
  function buildLivePayload(state,action){
    var acts=allActions(state);
    var P=state.players;
    var s=[statsForPlayer(acts,0),statsForPlayer(acts,1),statsForPlayer(acts,2),statsForPlayer(acts,3)];
    var v=[serveStats(acts,0),serveStats(acts,1),serveStats(acts,2),serveStats(acts,3)];
    var runs=scoringRuns(acts),pace=pointPace(acts);
    var tRecv=s[0].recv+s[1].recv,tWins=s[0].wins+s[1].wins;
    var isScore=(action&&typeof action==="object"&&action.src==="score")||
      (acts.length&&acts[acts.length-1].src==="score");
    var label=action==="undo"?"undo":lastActionLabel(acts,P);
    var payload={
      timestamp:new Date().toISOString(),
      scoreUs:state.sU,scoreThem:state.sT,
      setsUs:state.setsU,setsThem:state.setsT,setNum:state.setNum,
      phase:isScore?"":(state.recvSide===0?"sideout":"transition"),
      server:isScore?"":P[serverGI(state)].name,
      lastAction:label,
      soTeam:tRecv?Math.round((tWins/tRecv)*100):0,
      bestRunUs:runs.us,bestRunThem:runs.them,pointPace:pace.avg,
      last8:last8(acts),matchOver:state.matchOver,
      overlay:state.overlayFlags,
      lastActionFull:buildActionRecord(state,action)
    };
    var prefixes=["p1","p2","o1","o2"];
    for(var i=0;i<4;i++){
      var pf=prefixes[i];
      payload[pf+"Name"]=P[i].name;
      payload[pf+"SO"]=Math.round(s[i].so);
      payload[pf+"Recv"]=s[i].recv;
      payload[pf+"Wins"]=s[i].wins;
      payload[pf+"Zeros"]=s[i].zeros;
      payload[pf+"Lost"]=s[i].losses;
      payload[pf+"Blocked"]=s[i].blocked;
      payload[pf+"Aced"]=s[i].aced;
      payload[pf+"Errors"]=s[i].errors;
      payload[pf+"SvAces"]=v[i].aces;
      payload[pf+"SvcErr"]=v[i].errs;
    }
    return payload;
  }
  function buildCSV(state){
    var P=state.players;
    var r=[];
    r.push("--- RAW ACTIONS ---");
    r.push("Set,Receiver,Winner,Outcome,Detail,Server,WinnerTeam,Src,Timestamp,Elapsed_ms");
    function add(sn,acts){
      acts.forEach(function(a){
        var recv=a.receiver>=0?P[a.receiver].name:"";
        var win=(a.winner!==null&&a.winner!==undefined&&a.winner>=0)?P[a.winner].name:"";
        var srv=a.server>=0?P[a.server].name:"";
        r.push(sn+","+recv+","+win+","+a.outcome+","+(a.detail||"")+","+srv+","+a.winnerTeam+","+(a.src||"live")+","+new Date(a.t).toISOString()+","+a.e);
      });
    }
    state.sets.forEach(function(st){add(st.setNum,st.actions)});
    if(!state.matchOver)add(state.setNum,state.actions);
    r.push("");r.push("--- SET SCORES ---");
    r.push("Set,Us,Them,Winner");
    state.sets.forEach(function(st){r.push(st.setNum+","+st.sU+","+st.sT+","+st.winner)});
    if(!state.matchOver)r.push(state.setNum+","+state.sU+","+state.sT+",live");
    r.push("");r.push("--- PLAYER STATS ---");
    r.push("Player,Team,SO_Eff,Recv,Wins,Zeros,Losses,Blocked,Aced,Errors,SvAces,SvcErr");
    var acts=allActions(state);
    for(var i=0;i<4;i++){
      var so=statsForPlayer(acts,i),sv=serveStats(acts,i);
      var team=i<2?"us":"them";
      r.push(P[i].name+","+team+","+Math.round(so.so)+","+so.recv+","+so.wins+","+so.zeros+","+so.losses+","+so.blocked+","+so.aced+","+so.errors+","+sv.aces+","+sv.errs);
    }
    return r.join("\n");
  }
  function buildVLCChapters(state){
    var P=state.players;
    var ref=state.videoSync||state.t0;
    var acts=allActions(state);
    var lines=[];
    acts.forEach(function(a,i){
      var recv=a.receiver>=0?P[a.receiver].name:"?";
      var win=(a.winner!==null&&a.winner!==undefined&&a.winner>=0)?P[a.winner].name:"";
      var n=i+1;var pad=n<10?"0":"";
      lines.push("CHAPTER"+pad+n+"="+msToTC(a.t-ref));
      lines.push("CHAPTER"+pad+n+"NAME="+a.outcome+" recv:"+recv+(win?" win:"+win:""));
    });
    return lines.join("\n");
  }
  return{
    OUTCOMES:OUTCOMES,LIVE_COLUMNS:LIVE_COLUMNS,ACTIONS_COLUMNS:ACTIONS_COLUMNS,
    allActions:allActions,totalActionCount:totalActionCount,serverGI:serverGI,
    applyAction:applyAction,applyUndo:applyUndo,
    statsForPlayer:statsForPlayer,serveStats:serveStats,
    scoringRuns:scoringRuns,last8:last8,pointPace:pointPace,
    lastActionLabel:lastActionLabel,msToTC:msToTC,
    buildActionRecord:buildActionRecord,buildLivePayload:buildLivePayload,
    buildCSV:buildCSV,buildVLCChapters:buildVLCChapters
  };
})();
/* @core-end */

/* ═══════════════════════════════════
   HELPERS — strict $ (ghost ids fail loudly; test.js cross-checks literals)
   ═══════════════════════════════════ */
function $(id){
  var el=document.getElementById(id);
  if(!el&&window.console)console.error("missing #"+id);
  return el;
}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function hexDk(h,f){
  var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return"#"+((1<<24)+(Math.round(r*f)<<16)+(Math.round(g*f)<<8)+Math.round(b*f)).toString(16).slice(1);
}

/* ═══════════════════════════════════
   SCREEN ROUTING + SWIPE-BACK PROTECTION
   ═══════════════════════════════════ */
var screenStack=["scr-start"];
var currentScreen="scr-start";
var handlingPop=false;

function show(id){
  var s=document.querySelectorAll(".screen");
  for(var i=0;i<s.length;i++)s[i].classList.remove("active");
  var el=$(id);
  if(el)el.classList.add("active");
  currentScreen=id;
  if(!handlingPop){
    screenStack.push(id);
    try{history.pushState({screen:id},"","")}catch(e){}
  }
}
window.addEventListener("popstate",function(){
  handlingPop=true;
  if(screenStack.length>1){
    screenStack.pop();
    var target=screenStack[screenStack.length-1];
    var s=document.querySelectorAll(".screen");
    for(var i=0;i<s.length;i++)s[i].classList.remove("active");
    var el=$(target);
    if(el)el.classList.add("active");
    currentScreen=target;
  }
  try{history.pushState({guard:true},"","")}catch(e){}
  handlingPop=false;
});
try{
  history.replaceState({screen:"scr-start"},"","");
  history.pushState({guard:true},"","");
}catch(e){}
window.addEventListener("beforeunload",function(e){
  if(G&&(G.sU>0||G.sT>0||G.actions.length>0)){
    e.preventDefault();e.returnValue="";
  }
});

  // Only fresh-state on a true match start (set 1, no sets archived) —
  // set 2+ comes back through this screen and must NOT wipe the match.
  if(G.setNum===1&&G.sets.length===0){
    G=freshState();
    G.videoSync=Date.now();
  }
  G.recvSide=side===0?1:0;
  G.pending=null;
  vib(50);
  show("scr-recv");upd();
}

}

function upd(){
  var weRecv=G.recvSide===0;
  var pair=recvPair();
  var swapped=layout==="p2left";
  var pLft=swapped?pair[1]:pair[0];
  var pRgt=swapped?pair[0]:pair[1];
  $("rs-phase").textContent=weRecv?"Sideout":"Transition";
  $("rs-phase").style.color=weRecv?"#809671":"#B58860";
  var sv=$("rs-serve");
  sv.textContent=serverName()+" serving";
  sv.style.color=PL[serverGI()].color;
  $("rs-us").textContent=G.sU;
  $("rs-them").textContent=G.sT;
  $("rs-sets").textContent="S "+G.setsU+"-"+G.setsT;
  $("rs-left").style.background=hexDk(PL[pLft].color,0.2);
  $("rs-right").style.background=hexDk(PL[pRgt].color,0.2);
  $("rs-left-name").textContent=PL[pLft].name;
  $("rs-left-name").style.color=PL[pLft].color;
  $("rs-right-name").textContent=PL[pRgt].name;
  $("rs-right-name").style.color=PL[pRgt].color;
  var acts=Core.allActions(pState());
  var sL=Core.statsForPlayer(acts,pLft),sR=Core.statsForPlayer(acts,pRgt);
  $("rs-left-stat").textContent=sL.recv?Math.round(sL.so)+"%  "+sL.wins+"/"+sL.recv:"-  0/0";
  $("rs-right-stat").textContent=sR.recv?Math.round(sR.so)+"%  "+sR.wins+"/"+sR.recv:"-  0/0";
  var offPair=weRecv?[2,3]:[0,1];
  var offL=swapped?offPair[1]:offPair[0];
  var offR=swapped?offPair[0]:offPair[1];
  var oL=Core.statsForPlayer(acts,offL),oR=Core.statsForPlayer(acts,offR);
  $("rs-off-left").innerHTML='<span style="color:'+PL[offL].color+'">'+PL[offL].name+'</span> <span style="color:#8A8378">'+(oL.recv?Math.round(oL.so)+"%":"-")+'</span>';
  $("rs-off-right").innerHTML='<span style="color:'+PL[offR].color+'">'+PL[offR].name+'</span> <span style="color:#8A8378">'+(oR.recv?Math.round(oR.so)+"%":"-")+'</span>';
  $("rs-svc-text").textContent=weRecv?"Opp serve error":"Our serve error";
  $("rs-undo").style.opacity=G.actions.length?"0.7":"0.2";
}
function pickRecv(idx){
  var pair=recvPair();
  var swapped=layout==="p2left";
  var pLft=swapped?pair[1]:pair[0];
  var pRgt=swapped?pair[0]:pair[1];
  var recvGI=idx===0?pLft:pRgt;
  G.pending={receiver:recvGI,server:serverGI(),recvSide:G.recvSide};
  vib(40);show("scr-outcome");
}
// UI outcome buttons → canonical action codes (CONTRACT.md §1)
function pickOutcome(code){
  if(!G.pending)return;
  vib(40);
  var p=G.pending;G.pending=null;
  var recvTeam=p.recvSide===0?"us":"them";
  var servTeam=p.recvSide===0?"them":"us";
  var map={
    clean_so:{outcome:"clean_so",winner:p.receiver,winnerTeam:recvTeam},
    zero_won:{outcome:"zero_won",winner:null,winnerTeam:recvTeam},
    zero_lost:{outcome:"zero_lost",winner:null,winnerTeam:servTeam},
    aced:{outcome:"aced",winner:null,winnerTeam:servTeam},
    blocked:{outcome:"blocked",winner:null,winnerTeam:servTeam},
    error:{outcome:"recv_error",winner:null,winnerTeam:servTeam}
  };
  var m=map[code];
  if(!m)return;
  commitAction({
    outcome:m.outcome,detail:null,
    receiver:p.receiver,server:p.server,winner:m.winner,winnerTeam:m.winnerTeam,
    recvSide:p.recvSide,servers:[G.servers[0],G.servers[1]],
    t:Date.now(),e:Date.now()-G.t0,src:"live"
  });
}
function svcError(){
  vib([40,20,40]);
  commitAction({
    outcome:"svc_error",detail:null,
    receiver:-1,server:serverGI(),winner:null,
    winnerTeam:G.recvSide===0?"us":"them",
    recvSide:G.recvSide,servers:[G.servers[0],G.servers[1]],
    t:Date.now(),e:Date.now()-G.t0,src:"live"
  });
}
function commitAction(act){
  Core.applyAction(G,act);
  // Set-end screen must win over the recv screen — never show recv after a set-ending point.
  if(!checkSetEnd()){
    show("scr-recv");upd();
  }
  livePush(act);
}
function checkSetEnd(){
  var t=G.target;
  var uW=G.sU>=t&&(G.sU-G.sT)>=2;
  var tW=G.sT>=t&&(G.sT-G.sU)>=2;
  if(!uW&&!tW)return false;
  var w=uW?"us":"them";
  G.sets.push({setNum:G.setNum,sU:G.sU,sT:G.sT,winner:w,actions:G.actions.slice()});
  if(w==="us")G.setsU++;else G.setsT++;
  if(G.setsU>=2||G.setsT>=2){G.matchOver=true;showMatchOver()}
  else showSetComplete();
  return true;
}
function undoLast(){
  if(!G.actions.length)return;
  Core.applyUndo(G);
  vib(20);show("scr-recv");upd();
  livePush("undo");
}
function showSetComplete(){
  $("set-label").textContent="Set "+G.setNum+" complete";
  $("set-score").textContent=G.sU+" : "+G.sT;
  $("set-sets").textContent="Sets: "+G.setsU+" - "+G.setsT;
  show("scr-set");
}
function showMatchOver(){
  $("match-winner").textContent=G.setsU>G.setsT?"We win":"They win";
  $("match-winner").style.color=G.setsU>G.setsT?"#809671":"#B58860";
  $("match-sets").textContent=G.setsU+" - "+G.setsT;
  var sc=[];G.sets.forEach(function(s){sc.push(s.sU+"-"+s.sT)});
  $("match-scores").textContent="("+sc.join(", ")+")";
  show("scr-match");
}

/* ═══════════════════════════════════
   SCORE MODE
   ═══════════════════════════════════ */
function enterScoreMode(){
  G.videoSync=Date.now();
  show("scr-score");
  updScore();
}
function scoreTap(side){
  if(currentScreen!=="scr-score")return;
  vib(20);
  var t=Date.now();
  var act={
    outcome:"score_tap",detail:null,
    receiver:-1,server:-1,winner:null,
    winnerTeam:side,
    recvSide:G.recvSide,servers:[G.servers[0],G.servers[1]],
    t:t,e:t-G.t0,src:"score"
  };
  Core.applyAction(G,act);
  updScore();
  livePush(act);
}
function scoreUndoOne(){
  if(!G.actions.length)return;
  vib(30);
  Core.applyUndo(G);
  updScore();
  livePush("undo");
}
function updScore(){
  $("sc-us").textContent=G.sU;
  $("sc-them").textContent=G.sT;
}

/* ═══════════════════════════════════
   LIVE PUSH
   ═══════════════════════════════════ */
function livePush(action){
  if(!G.livePush||!sheetsUrl)return;
  var payload;
  try{payload=Core.buildLivePayload(pState(),action)}
  catch(e){if(window.console)console.error("payload build failed",e);return}
  try{
    fetch(sheetsUrl,{
      method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
function toggleLivePush(){
  G.livePush=!G.livePush;
  updLiveVal();
  if(G.livePush&&sheetsUrl)livePush("connect");
  vib(G.livePush?[50,30,50]:30);
}
function updLiveVal(){
  var el=$("live-val");
  if(el){
    el.textContent=G.livePush?"ON":"OFF";
    el.style.color=G.livePush?"#9BB56E":"#5A5247";
  }
}
function sendTestPing(){
  var st=$("ping-status");
  if(st){st.textContent="...";st.style.color="#C8A050"}
  var payload;
  try{payload=Core.buildLivePayload(pState(),"test")}
  catch(e){if(st){st.textContent="ERR";st.style.color="#A04938"}return}
  fetch(sheetsUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)})
    .then(function(){if(st){st.textContent="Sent";st.style.color="#9BB56E"}vib(50)})
    .catch(function(){if(st){st.textContent="Failed";st.style.color="#A04938"}});
}
function saveSheetsUrl(){
  var el=$("sheets-url-input");
  if(!el||!el.value)return;
  sheetsUrl=el.value;
  el.value="";
  el.placeholder=sheetsUrl.slice(0,40)+"...";
  vib(40);
}

/* ═══════════════════════════════════
   STATS SCREEN (paged)
   ═══════════════════════════════════ */
var STATS_PAGES=4;
function openStats(){
  statsReturn=currentScreen==="scr-stats"?statsReturn:currentScreen;
  statsPage=0;
  renderStats();
  show("scr-stats");
}
function closeStats(){show(statsReturn||"scr-recv");if(statsReturn==="scr-recv")upd()}
function statsNav(d){
  statsPage=(statsPage+d+STATS_PAGES)%STATS_PAGES;
  vib(15);renderStats();
}
function setStatsFilter(f){statsSetFilter=f;renderStats()}
function actsForStats(){
  if(statsSetFilter===null)return Core.allActions(pState());
  for(var i=0;i<G.sets.length;i++){
    if(G.sets[i].setNum===statsSetFilter)return G.sets[i].actions.slice();
  }
  if(G.setNum===statsSetFilter)return G.actions.slice();
  return[];
}
function soStr(s){return s.recv?Math.round(s.so)+"%":"-"}
function renderStats(){
  var c=$("stp-content");
  var pg=$("stp-page");
  if(pg)pg.textContent=(statsPage+1)+"/"+STATS_PAGES;
  if(!c)return;
  var acts=actsForStats();
  var h="";
  if(statsPage===0){
    // Page 1: match overview + set filter
    var setNums=[];
    G.sets.forEach(function(s){setNums.push(s.setNum)});
    if(setNums.indexOf(G.setNum)<0&&!G.matchOver)setNums.push(G.setNum);
    h+='<div class="hdr">Match</div>';
    h+='<div style="text-align:center;font-size:clamp(34px,13vw,54px);font-weight:900">'
      +'<span style="color:#809671">'+G.sU+'</span>'
      +'<span style="color:rgba(255,255,255,0.2);font-weight:400"> : </span>'
      +'<span style="color:#B58860">'+G.sT+'</span></div>';
    h+='<div style="text-align:center;color:#5A5247;font-size:clamp(13px,4.6vw,17px);font-weight:700">Sets '+G.setsU+' - '+G.setsT+' · Set '+G.setNum+' to '+G.target+'</div>';
    h+='<div class="pill-row"><button class="pill'+(statsSetFilter===null?" on":"")+'" onclick="setStatsFilter(null)">All</button>';
    setNums.forEach(function(n){
      h+='<button class="pill'+(statsSetFilter===n?" on":"")+'" onclick="setStatsFilter('+n+')">S'+n+'</button>';
    });
    h+='</div>';
    var u0=Core.statsForPlayer(acts,0),u1=Core.statsForPlayer(acts,1);
    var t0=Core.statsForPlayer(acts,2),t1=Core.statsForPlayer(acts,3);
    var uRecv=u0.recv+u1.recv,uWins=u0.wins+u1.wins;
    var tRecv=t0.recv+t1.recv,tWins=t0.wins+t1.wins;
    h+='<div class="row"><span class="l" style="color:#809671">Our SO%</span><span class="v" style="color:#809671">'+(uRecv?Math.round(uWins/uRecv*100)+"%":"-")+' <span style="color:#5A5247;font-weight:600">'+uWins+'/'+uRecv+'</span></span></div>';
    h+='<div class="row"><span class="l" style="color:#B58860">Their SO%</span><span class="v" style="color:#B58860">'+(tRecv?Math.round(tWins/tRecv*100)+"%":"-")+' <span style="color:#5A5247;font-weight:600">'+tWins+'/'+tRecv+'</span></span></div>';
    h+='<div class="row"><span class="l">Points</span><span class="v">'+acts.length+'</span></div>';
  }else if(statsPage===1||statsPage===2){
    var gis=statsPage===1?[0,1]:[2,3];
    h+='<div class="hdr">'+(statsPage===1?"Our players":"Opponents")+'</div>';
    gis.forEach(function(gi){
      var s=Core.statsForPlayer(acts,gi),sv=Core.serveStats(acts,gi);
      h+='<div class="pcard">';
      h+='<div class="pname" style="color:'+PL[gi].color+'">'+PL[gi].name+'</div>';
      h+='<div class="pso" style="color:'+PL[gi].color+'">'+soStr(s)+'</div>';
      h+='<div class="row"><span class="l">Recv W-Z-L</span><span class="v">'+s.recv+' · '+s.wins+'-'+s.zeros+'-'+s.losses+'</span></div>';
      h+='<div class="row"><span class="l">-1: blk / ace / err</span><span class="v" style="color:#A04938">'+s.blocked+' / '+s.aced+' / '+s.errors+'</span></div>';
      h+='<div class="row"><span class="l">Serve ace / err</span><span class="v"><span style="color:#9BB56E">'+sv.aces+'</span> / <span style="color:#A04938">'+sv.errs+'</span></span></div>';
      h+='</div>';
    });
  }else{
    var runs=Core.scoringRuns(acts),pace=Core.pointPace(acts);
    var sv0=Core.serveStats(acts,0),sv1=Core.serveStats(acts,1);
    var sv2=Core.serveStats(acts,2),sv3=Core.serveStats(acts,3);
    h+='<div class="hdr">Serve &amp; momentum</div>';
    h+='<div class="row"><span class="l" style="color:#809671">Our aces / errs</span><span class="v">'+(sv0.aces+sv1.aces)+' / '+(sv0.errs+sv1.errs)+'</span></div>';
    h+='<div class="row"><span class="l" style="color:#B58860">Their aces / errs</span><span class="v">'+(sv2.aces+sv3.aces)+' / '+(sv2.errs+sv3.errs)+'</span></div>';
    h+='<div class="row"><span class="l">Best run us</span><span class="v" style="color:#9BB56E">'+runs.us+'</span></div>';
    h+='<div class="row"><span class="l">Best run them</span><span class="v" style="color:#A04938">'+runs.them+'</span></div>';
    h+='<div class="row"><span class="l">Pace</span><span class="v">'+(pace.avg?pace.avg+" s/pt":"-")+'</span></div>';
  }
  c.innerHTML=h;
}

/* ═══════════════════════════════════

function openSettings(from){
  settingsReturn=from||currentScreen;
  initSettingsInputs();
  show("scr-settings");
}
function closeSettings(){
  show(settingsReturn||"scr-start");
  if(settingsReturn==="scr-recv")upd();
  if(settingsReturn==="scr-stats")renderStats();
  if(settingsReturn==="scr-score")updScore();
}
function openConfirm(){
  var el=$("ovl-confirm");
  if(el)el.classList.add("active");
}
function closeConfirm(){
  var el=$("ovl-confirm");
  if(el)el.classList.remove("active");
}

   EXPORTS
   ═══════════════════════════════════ */
function downloadCSV(){
  var c=Core.buildCSV(pState());
  var b=new Blob([c],{type:"text/csv"});
  var u=URL.createObjectURL(b);
  var l=document.createElement("a");
  l.href=u;l.download="bv_"+new Date().toISOString().slice(0,10)+".csv";
  l.click();URL.revokeObjectURL(u);
}
function downloadVLCChapters(){
  var ch=Core.buildVLCChapters(pState());
  if(!ch)return;
  var b=new Blob([ch],{type:"text/plain"});
  var u=URL.createObjectURL(b);
  var l=document.createElement("a");
  l.href=u;l.download="bv_"+new Date().toISOString().slice(0,10)+".chapters.txt";
  l.click();URL.revokeObjectURL(u);
}

initSettingsInputs();
if(gameMode==="score")enterScoreMode();
